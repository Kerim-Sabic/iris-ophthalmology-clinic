# Netlify build settings for IRIS (static Vite build; hash-based routing, so no SPA redirects are needed)
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Playwright browsers are only needed for local e2e tests, not for the site build
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Narration audio and hashed assets can be cached for a long time
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/audio/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
